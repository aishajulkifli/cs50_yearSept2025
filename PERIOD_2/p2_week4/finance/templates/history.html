{% extends "layout.html" %}

{% block main %}
<h1>Transaction History</h1>

{% if rows %}
<table border="1">
    <tr>
        <th>Type</th>
        <th>Symbol</th>
        <th>Shares</th>
        <th>Price</th>
        <th>Date</th>
    </tr>
    {% for row in rows %}
    <tr>
        <td>{{ row.type }}</td>
        <td>{{ row.symbol }}</td>
        <td>{{ row.shares }}</td>
        <td>{{ row.price | usd }}</td>
        <td>{{ row.timestamp }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No transactions yet.</p>
{% endif %}
{% endblock %}
